<!DOCTYPE html>
<!--
  Open this file in Chrome to generate the extension icons.
  Right-click each canvas → "Save image as" → save as icon16.png, icon48.png, icon128.png
-->
<html>
<body style="background:#222; padding:20px; display:flex; gap:20px; align-items:flex-end;">
<script>
  function makeIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width  = size;
    canvas.height = size;
    canvas.title  = `icon${size}.png — right-click → Save image as`;
    canvas.style.imageRendering = 'pixelated';

    const ctx = canvas.getContext('2d');
    const r   = size * 0.12; // corner radius

    // Navy rounded rect background
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.roundRect(0, 0, size, size, r);
    ctx.fill();

    // Amber lightning bolt ⚡
    ctx.fillStyle = '#f59e0b';
    ctx.font      = `bold ${size * 0.62}px serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚡', size / 2, size / 2 + size * 0.04);

    document.body.appendChild(canvas);

    const label = document.createElement('div');
    label.textContent = `${size}×${size}  →  icon${size}.png`;
    label.style = 'color:#aaa; font:11px monospace; text-align:center; margin-top:6px;';

    const wrap = document.createElement('div');
    wrap.style = 'display:flex; flex-direction:column; align-items:center;';
    document.body.appendChild(wrap);
    wrap.appendChild(canvas);
    wrap.appendChild(label);
  }

  [16, 48, 128].forEach(makeIcon);
</script>
</body>
</html>
