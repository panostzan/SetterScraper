<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      width: 300px;
      background: #0d0d14;
      color: #ede9fe;
    }

    /* ── Header ── */
    .header {
      padding: 18px 18px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(109,40,217,0.4);
    }
    .logo svg { width: 18px; height: 18px; }
    .header-text {}
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #f5f3ff;
      letter-spacing: -0.3px;
    }
    .header-sub {
      font-size: 11px;
      color: #6d28d9;
      margin-top: 1px;
      font-weight: 500;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(109,40,217,0.25) 30%, rgba(109,40,217,0.25) 70%, transparent);
      margin: 0 18px;
    }

    /* ── Body ── */
    .body { padding: 16px 18px 18px; }

    /* ── Stats ── */
    .stats {
      display: flex; gap: 10px; margin-bottom: 14px;
    }
    .stat {
      flex: 1;
      background: rgba(109,40,217,0.08);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat-n {
      font-size: 26px;
      font-weight: 700;
      color: #a78bfa;
      line-height: 1;
      letter-spacing: -1px;
    }
    .stat-l {
      font-size: 10px;
      color: rgba(167,139,250,0.4);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 500;
    }

    /* ── Status card ── */
    .status-card {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 14px;
    }

    .progress-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%; flex-shrink: 0;
      background: rgba(255,255,255,0.1);
      transition: background 0.3s;
    }
    .dot.syncing {
      background: #8b5cf6;
      animation: glow-pulse 1.5s ease-in-out infinite;
    }
    .dot.done  { background: #34d399; }
    .dot.error { background: #f87171; }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.6); }
      50%       { box-shadow: 0 0 0 5px rgba(139,92,246,0); }
    }

    .progress-track {
      flex: 1; height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6d28d9, #a78bfa);
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-pct {
      font-size: 10px;
      color: rgba(139,92,246,0.5);
      width: 28px; text-align: right; flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .status-text {
      font-size: 12px;
      color: rgba(237,233,254,0.45);
      line-height: 1.5;
    }
    .status-text.active {
      color: rgba(237,233,254,0.7);
    }

    /* ── Button ── */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.1px;
      background: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%);
      color: #fff;
      margin-bottom: 10px;
      box-shadow: 0 4px 16px rgba(109,40,217,0.35);
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    .btn:hover:not(:disabled) {
      opacity: 0.92;
      box-shadow: 0 6px 20px rgba(109,40,217,0.5);
    }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Sheet link ── */
    .sheet-link {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 12px; font-weight: 500;
      color: rgba(167,139,250,0.6);
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 12px;
      transition: color 0.15s;
      letter-spacing: -0.1px;
    }
    .sheet-link:hover { color: #a78bfa; }
    .sheet-link svg { width: 12px; height: 12px; opacity: 0.7; }

    /* ── Footer ── */
    .footer {
      font-size: 10.5px;
      color: rgba(255,255,255,0.12);
      text-align: center;
      letter-spacing: 0.1px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">SetterScraper</div>
      <div class="header-sub">Nuvohub → Google Sheets</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="body">
    <div id="stats" class="stats" style="display:none">
      <div class="stat">
        <div class="stat-n" id="stat-total">—</div>
        <div class="stat-l">Clients</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="stat-new">—</div>
        <div class="stat-l">New</div>
      </div>
    </div>

    <div class="status-card">
      <div class="progress-row" id="progress-row" style="display:none">
        <div class="dot syncing" id="dot"></div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-pct" id="progress-pct">0%</div>
      </div>
      <div class="progress-row" id="idle-row">
        <div class="dot" id="dot-idle"></div>
        <div class="status-text" id="status-idle">Open nuvohub.ca then click Sync.</div>
      </div>
      <div class="status-text active" id="status"></div>
    </div>

    <button class="btn" id="btn-sync">Sync Now</button>

    <a id="sheet-link" class="sheet-link" href="#" target="_blank" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open Spreadsheet
    </a>

    <div class="footer" id="footer"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
